<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ganify" />
    <link rel="manifest" href="/manifest.json" />
    <title>Ganify</title>
    <style>
      @font-face {
        font-family: 'PakTzy';
        src: url('/fonts/PakTzy.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      #splash-screen {
        position: fixed; inset: 0; z-index: 9999;
        background: #141414;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.7s;
      }
      .splash-content {
        display: flex; flex-direction: column; align-items: center;
        transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #splash-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash-screen.hide .splash-content { transform: scale(1.15); }
      .splash-logo-wrap {
        width: 88px; height: 88px;
        margin-bottom: 22px;
      }
      .splash-logo-wrap svg { width: 100%; height: 100%; display: block; }
      .splash-title {
        font-family: 'PakTzy', 'Quicksand', sans-serif;
        font-weight: 800; font-size: 1.75rem;
        letter-spacing: -0.04em; color: #FFFFFF;
        margin-bottom: 20px;
      }
      .splash-visualizer {
        display: flex; gap: 6px; align-items: flex-end; height: 30px;
      }
      .splash-visualizer span {
        display: block; width: 5px; background: #FFFFFF; border-radius: 3px;
        animation: splashEq 1s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }
      .splash-visualizer span:nth-child(1) { animation-delay: 0.1s; }
      .splash-visualizer span:nth-child(2) { animation-delay: 0.3s; }
      .splash-visualizer span:nth-child(3) { animation-delay: 0.0s; }
      .splash-visualizer span:nth-child(4) { animation-delay: 0.2s; }
      .splash-visualizer span:nth-child(5) { animation-delay: 0.4s; }
      @keyframes splashEq {
        0% { height: 6px; opacity: 0.5; }
        100% { height: 30px; opacity: 1; }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash-screen">
      <div class="splash-content">
        <div class="splash-logo-wrap">
          <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="512" height="512" rx="112" fill="#0D0D0D"/>
            <path
              d="M348 180
                 C322 151 282 136 238 136
                 C169 136 116 188 116 256
                 C116 324 169 376 238 376
                 C282 376 322 361 348 331
                 V256
                 H250"
              stroke="#FFFFFF"
              stroke-width="38"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="220" cy="256" r="46" fill="#F5F5F5"/>
            <circle cx="220" cy="256" r="38" stroke="#C8C8C8" stroke-width="2"/>
            <circle cx="220" cy="256" r="31" stroke="#D5D5D5" stroke-width="2"/>
            <g stroke="#0D0D0D" stroke-width="5" stroke-linecap="round">
              <path d="M192 250V262"/>
              <path d="M200 243V269"/>
              <path d="M208 237V275"/>
              <path d="M216 246V266"/>
              <path d="M224 231V281"/>
              <path d="M232 239V273"/>
              <path d="M240 246V266"/>
              <path d="M248 241V271"/>
            </g>
            <circle cx="220" cy="256" r="4" fill="#F5F5F5"/>
          </svg>
        </div>
        <div class="splash-title">GANIFY</div>
        <div class="splash-visualizer">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script>
      window.addEventListener('load', function () {
        var sp = document.getElementById('splash-screen');
        if (!sp) return;
        setTimeout(function () {
          sp.classList.add('hide');
          setTimeout(function () {
            if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
          }, 350);
        }, 1600);
      });
    </script>
  </body>
</html>
